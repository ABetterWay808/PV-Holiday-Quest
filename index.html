<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Puerto Vallarta Holiday Quest</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --ink: #1f2d3d;
      --muted: #5a6b7c;
      --border: #e6d8c7;
      --teal: #0f766e;
      --teal-light: #e6f4f1;
      --coral: #d95d39;
      --gold: #d97706;
      --p1: #d95d39;
      --p2: #0f766e;
      --p3: #6d28d9;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --warn: #b45309;
      --warn-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 14px 28px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(31, 45, 61, 0.06);
    }

    .hidden {
      display: none !important;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      line-height: 1.2;
      color: var(--ink);
      text-align: center;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 0.98rem;
      color: var(--muted);
      text-align: center;
    }

    .hero-art {
      width: 100%;
      max-width: 340px;
      margin: 0 auto 12px;
      display: block;
    }

    .rules-box {
      background: #fdf3e6;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .rules-box ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }

    .rules-box li {
      margin-bottom: 4px;
    }

    .btn-primary {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      background: var(--teal);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 16px;
      box-shadow: 0 4px 0 #094c47;
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #094c47;
    }

    /* Scoreboard & Track */
    .scoreboard {
      padding: 12px;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .lane {
      display: grid;
      grid-template-columns: 78px 1fr 38px;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      background: #faf6f0;
      border: 1.5px solid transparent;
    }

    .lane:last-child {
      margin-bottom: 0;
    }

    .lane.active-turn {
      background: #fff4e4;
      border-color: var(--gold);
    }

    .player-tag {
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .step {
      height: 14px;
      border-radius: 999px;
      background: #e5dccf;
      transition: background 0.25s ease;
    }

    .step.filled-1 { background: var(--p1); }
    .step.filled-2 { background: var(--p2); }
    .step.filled-3 { background: var(--p3); }

    .score-num {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
    }

    /* Turn Banner */
    .turn-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.98rem;
      color: #ffffff;
    }

    .turn-p1 { background: var(--p1); }
    .turn-p2 { background: var(--p2); }
    .turn-p3 { background: var(--p3); }

    .goal-badge {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.22);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Postcard Deduction Stamps */
    .stamps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
